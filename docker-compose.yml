
services:
  web:
    build:
      context: .
      dockerfile: ./Dockerfile
    container_name: stitcher_fastapi
    deploy:
      resources:
        limits:
          memory: 20g
    volumes:
      - ./app:/code/app
      - /pool1/srv/label-studio/mydata/stitchermedia:/media
      - sqlite_data:/data
    command: fastapi run app/main.py --port 8090
    ports:
          - "8090:8090"

volumes:
  sqlite_data:
