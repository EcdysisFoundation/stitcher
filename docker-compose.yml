
services:
  web:
    build:
      context: .
      dockerfile: ./Dockerfile
    image: mikaylaelectra/stitcher
    container_name: stitcher_fastapi
    volumes:
      - ./app:/code/app
      - ./media:/media
      - sqlite_data:/data
    command: fastapi run app/main.py --port 8090
    ports:
          - "8090:8090"

volumes:
  sqlite_data:
